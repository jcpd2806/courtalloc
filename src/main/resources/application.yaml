spring:
  application:
    name: courtalloc-api
  datasource:
    url: jdbc:postgresql://localhost:5432/courtalloc_db
    username: courtalloc_user
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect